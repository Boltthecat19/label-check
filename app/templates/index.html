{% extends "base.html" %}
{% block body %}
<form hx-post="/verify" hx-target="#result" hx-encoding="multipart/form-data" hx-indicator="#busy" hx-disabled-elt="#go">
  <section class="step">
    <h2>Step 1. Enter what the application says</h2>
    <label>Brand name <span class="req">(required)</span>
      <input name="brand" required autocomplete="off" placeholder="OLD TOM DISTILLERY"></label>
    <label>Class or type
      <input name="class_type" placeholder="Kentucky Straight Bourbon Whiskey"></label>
    <div class="row">
      <label>Alcohol content, percent
        <input name="abv_percent" inputmode="decimal" placeholder="45"></label>
      <label>Net contents
        <input name="net_contents" placeholder="750 mL"></label>
    </div>
    <label>Bottler or producer
      <input name="bottler" placeholder="Old Tom Distillery, Bardstown, KY"></label>
    <div class="row">
      <label>Beverage type
        <select name="beverage_type">{% for b in beverages %}<option value="{{ b }}">{{ b|capitalize }}</option>{% endfor %}</select></label>
      <label class="check"><input type="checkbox" name="is_import" value="yes"
        onchange="document.getElementById('origin').hidden = !this.checked"> This is an import</label>
    </div>
    <label id="origin" hidden>Country of origin
      <input name="origin_country" placeholder="Scotland"></label>
  </section>

  <section class="step">
    <h2>Step 2. Add the label image</h2>
    <p>Take a photo or choose the label image. JPG or PNG, up to 10 MB.</p>
    <input type="file" name="image" accept="image/*" required>
  </section>

  <section class="step">
    <h2>Step 3. Check it</h2>
    <button id="go" class="primary" type="submit">Check this label</button>
    <p id="busy" class="htmx-indicator">Checking, one moment.</p>
  </section>
</form>
<div id="result"></div>
{% endblock %}
